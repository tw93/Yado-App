name: Feature request / 功能建议
description: Suggest an improvement to Yado / 给 Yado 提建议
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        Share an idea for **Yado**. Tell me what would make the app more useful to you, and check whether the latest version already has it.

        这里用于给 **Yado** 提建议，说说怎样能让 App 更好用，提之前先看看最新版里是否已经有了。
  - type: textarea
    id: problem
    attributes:
      label: What would you like to improve? / 想改善什么？
      description: Describe what you are trying to do and where the app falls short / 说明你想做什么，以及当前哪里不够好用
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: Your idea / 你的建议
      description: A possible solution, example or screenshot / 可以补充做法、例子或截图
